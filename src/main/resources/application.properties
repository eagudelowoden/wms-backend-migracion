spring.application.name=wms-backend

# Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración para la base de datos wms_wd_general
spring.datasource.url=jdbc:sqlserver://wd-wms-prd.cyeyhpu1wzr0.us-east-2.rds.amazonaws.com:14331;databaseName=WmsWdGeneral;trustServerCertificate=true
spring.datasource.username=readermssql
spring.datasource.password=@e1aec2bc69bd4b1e
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

