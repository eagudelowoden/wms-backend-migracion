spring.application.name=wms-backend
#puerto de producción
server.port=9000
#puerto de test
#server.port=8080
app.version=@project.version@

# Ruta de la plantilla de hoja de vida (TruckRoll). Es global, no por cliente.
# Vacío por defecto: el backend prueba automáticamente Z:\ENV\PRD\pqrs\PLANTILLA
# y luego \\10.128.0.28\archivos\ENV\PRD\pqrs\PLANTILLA (ver DiagnosticoService),
# usando la primera que sea accesible en ese servidor. Solo llenar esta variable
# si algún día se necesita forzar una ruta distinta a esas dos.
HOJA_VIDA_PLANTILLA_PATH=

# ============================================================
# ⚙️ TOMCAT EMBEBIDO (rendimiento)
# ============================================================

server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=10000
server.tomcat.accept-count=1000
server.tomcat.connection-timeout=60s
server.tomcat.uri-encoding=UTF-8

# Compresión HTTP
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=text/html,text/xml,text/plain,application/json,application/javascript,application/xml

# Tamaño de headers (elige según tu versión de Spring Boot)
server.max-http-request-header-size=32KB 

# Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.proc.param_null_passing=true

# Configuración para la base de datos wms_wd_general
spring.datasource.url=jdbc:sqlserver://wd-wms-prd.cyeyhpu1wzr0.us-east-2.rds.amazonaws.com:14331;databaseName=WmsWdGeneral;trustServerCertificate=true
spring.datasource.username=adminmssql
spring.datasource.password=e140cc67e1aec2bc69bd4b1e0962ed5b
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración del pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.pool-name=WmsHikariCP

# ⚠️ Logging SQL desactivado en producción.
# En desarrollo: cambiar a DEBUG/TRACE para depurar queries.
# Con TRACE activo bajo carga cada petición genera ~50 líneas de log
# lo que satura el I/O y provoca 502 gateway timeout.
spring.jpa.show-sql=false
logging.level.com.woden.wms_backend.services.ClienteServices.TruckrollService=DEBUG
logging.level.com.woden.wms_backend.repositories.ClienteRepositories.TruckrollRepository=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.procedure=WARN



# ============================================================
# 📄 LOGS — Rotación cada día, retener 3 días, máximo 600 MB total
# ============================================================
logging.file.name=logs/wms-backend.log
logging.logback.rollingpolicy.file-name-pattern=logs/wms-backend-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=200MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=600MB
logging.logback.rollingpolicy.clean-history-on-start=true
#logging.file.name=logs/wms-backend.log  # (línea original, reemplazada)
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

spring.boot.admin.client.url=http://localhost:9001

#spring.boot.admin.client.url=https://wmstest.woden.com.co/admin

spring.boot.admin.client.instance.name=WMS-Backend-Daniel


