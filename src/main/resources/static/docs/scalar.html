<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scalar API Docs</title>
    <!-- Carga la versión standalone que trae Vue internamente -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.36.0/dist/browser/standalone.min.js"></script>
  </head>
  <body>
    <div id="api-reference"></div>
    <script>
      // Nota: aquí sí usamos window.ScalarApiReference
      const apiRef = new window.ScalarApiReference({
        element: "#api-reference",
        spec: {
          url: "/v3/api-docs", // tu JSON generado por Springdoc
        },
        theme: "default",
        layout: "modern",
      });
    </script>
  </body>
</html>
