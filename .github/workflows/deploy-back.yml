name: Deploy BACKEND (Final Fix)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SETUP JAVA Y BUILD
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # 2. SUBIR JAR A CARPETA TEMPORAL (Usamos Temp para evitar bloqueos)
      - name: Upload JAR to Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "target/*.jar"
          target: "C:/Windows/Temp/"
          strip_components: 1

      # 3. SCRIPT DE DESPLIEGUE (Corregido para detectar cualquier JAR)
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
                  $ErrorActionPreference = 'Stop'
                  Write-Host "=== STARTING BACKEND DEPLOY ==="

                  $basePath = "C:\apps\wms-backend"
                  $currentPath = "$basePath\current"
                  $backupRoot = "$basePath\backups"
                  $newJar = "$basePath\incoming\wms-backend.jar"

                  # 1. Crear carpetas si no existen
                  New-Item -ItemType Directory -Force -Path $currentPath | Out-Null
                  New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null

                  # 2. Backup del jar actual (si existe)
                  $currentJar = "$currentPath\wms-backend.jar"
                  if (Test-Path $currentJar) {
                      $timestamp = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
                      $backupDir = Join-Path $backupRoot $timestamp
                      New-Item -ItemType Directory -Force -Path $backupDir | Out-Null

                      Write-Host "BACKUP: Moving current jar to $backupDir"
                      Move-Item $currentJar "$backupDir\wms-backend.jar"
                  } else {
                      Write-Host "No existing jar found, skipping backup"
                  }

                  # 3. Detener backend (Java en puerto 9000)
                  Write-Host "STOPPING BACKEND..."
                  Get-Process java -ErrorAction SilentlyContinue | Where-Object {
                      $_.Path -like "*wms-backend*"
                  } | Stop-Process -Force

                  Start-Sleep -Seconds 3

                  # 4. Mover nuevo jar a current
                  Write-Host "DEPLOYING NEW JAR..."
                  Move-Item $newJar $currentJar -Force

                  # 5. Arrancar backend
                  Write-Host "STARTING BACKEND..."
                  Start-Process "java" `
                    -ArgumentList "-jar `"$currentJar`" --server.port=9000" `
                    -WorkingDirectory $currentPath `
                    -WindowStyle Hidden

                  Write-Host "=== BACKEND DEPLOY FINISHED ==="

