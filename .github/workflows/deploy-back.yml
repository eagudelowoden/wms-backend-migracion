name: Deploy BACK DEVELOP

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # BUILD BACKEND
      - name: Build Spring Boot
        run: |
          mvn clean package -DskipTests

      # SUBIR JAR NUEVO
      - name: Upload backend jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "target/*.jar"
          target: "C:/apps/wms-backend/incoming/"
          strip_components: 1

      # SUBIR SCRIPT
      - name: Upload backend deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "remote_backend_deploy.ps1"
          target: "C:/Windows/Temp/"

      # EJECUTAR SCRIPT
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script_stop: true
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\Windows\Temp\remote_backend_deploy.ps1"
            del "C:\Windows\Temp\remote_backend_deploy.ps1"
