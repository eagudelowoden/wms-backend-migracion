name: Deploy BACKEND TEST

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # -------------------------------------------------------------
      # PASO 1: GENERAR SCRIPT DE DESPLIEGUE
      # -------------------------------------------------------------
      - name: Create Backend Deployment Script
        run: |
          cat <<'EOF' > remote_deploy_backend.ps1
          $ErrorActionPreference = 'Stop'
          Write-Host "=== STARTING BACKEND TEST DEPLOYMENT ==="

          $deployDir = "C:\nginx-1.27.1\html\front"
          $backupDir = "C:\nginx-1.27.1\html\front\_backups\back"
          $tempPath  = "C:\Windows\Temp"
          $port      = 9000
          $timestamp = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'

          # 1. DETENER PROCESO EN PUERTO 9000
          Write-Host "Checking for process on port $port..."
          $connection = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue

          if ($connection) {
              $pidTarget = $connection.OwningProcess
              Write-Host "Killing process PID: $pidTarget"
              Stop-Process -Id $pidTarget -Force
              Start-Sleep -Seconds 5
          } else {
              Write-Host "Port $port is free."
          }

          # 2. BACKUP DEL JAR ACTUAL (conservando su nombre con versión)
          $currentJar = Get-ChildItem -Path $deployDir -Filter "wms-backend-*.jar" | Select-Object -First 1

          if ($currentJar) {
              if (-not (Test-Path $backupDir)) { New-Item -ItemType Directory -Path $backupDir -Force | Out-Null }
              $backupName = "$($currentJar.BaseName)_$timestamp.jar"
              $backupPath = Join-Path $backupDir $backupName
              Write-Host "Backup: $backupName"
              Move-Item -Path $currentJar.FullName -Destination $backupPath -Force
          } else {
              Write-Host "No existing JAR to backup."
          }

          # 3. MOVER NUEVO JAR DESDE TEMP (manteniendo nombre con versión)
          $newJar = Get-ChildItem -Path $tempPath -Filter "wms-backend-*.jar" | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $newJar) {
              Write-Error "ERROR: No JAR found in Temp."
              exit 1
          }

          $targetPath = Join-Path $deployDir $newJar.Name
          Write-Host "Deploying: $($newJar.Name)"
          Move-Item -Path $newJar.FullName -Destination $targetPath -Force

          # 4. ACTUALIZAR TAREA PROGRAMADA AL NUEVO JAR
          Write-Host "Updating scheduled task to: $targetPath"
          schtasks /change /tn "WMS-Backend" /tr "java -jar `"$targetPath`"" | Out-Null

          # 5. INICIAR VIA TAREA PROGRAMADA
          Write-Host "Starting via scheduled task WMS-Backend..."
          schtasks /end /tn "WMS-Backend" | Out-Null
          Start-Sleep -Seconds 3
          schtasks /run /tn "WMS-Backend"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not run scheduled task WMS-Backend."
              exit 1
          }

          # 6. VERIFICAR QUE EL PUERTO QUEDE ESCUCHANDO
          $started = $false
          for ($i = 1; $i -le 12; $i++) {
              Start-Sleep -Seconds 5
              if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) {
                  $started = $true
                  Write-Host "Backend listening on port $port (attempt $i)"
                  break
              }
              Write-Host "  Attempt $i/12 - port $port not ready yet..."
          }

          if (-not $started) {
              Write-Warning "Port $port not listening after 60s. Check backend log."
          }

          Write-Host "=== DEPLOYMENT COMPLETED: $($newJar.Name) ==="
          EOF

      # -------------------------------------------------------------
      # PASO 2: SUBIR SCRIPT AL SERVIDOR
      # -------------------------------------------------------------
      - name: Upload Deployment Script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "remote_deploy_backend.ps1"
          target: "C:/Windows/Temp/"

      # -------------------------------------------------------------
      # PASO 3: SUBIR JAR (con nombre de versión)
      # -------------------------------------------------------------
      - name: Upload JAR to Server Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "target/wms-backend-*.jar"
          target: "C:/Windows/Temp/"
          strip_components: 1

      # -------------------------------------------------------------
      # PASO 4: EJECUTAR SCRIPT DE DESPLIEGUE
      # -------------------------------------------------------------
      - name: Execute Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script_stop: true
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\Windows\Temp\remote_deploy_backend.ps1"
            del "C:\Windows\Temp\remote_deploy_backend.ps1"
