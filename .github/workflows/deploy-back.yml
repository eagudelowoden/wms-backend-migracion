name: Deploy BACKEND DEBUG

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-backend-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SETUP JAVA
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # 2. BUILD (Con Logs)
      - name: Build with Maven
        run: |
          mvn -B clean package -DskipTests
          echo "=========================================="
          echo "🔍 VERIFICANDO ARCHIVO JAR GENERADO:"
          ls -l target/
          echo "=========================================="

      # 3. SUBIR JAR (Quitamos el filtro de extensión para ver si sube algo)
      - name: Upload JAR to Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          # Intentamos subir explícitamente el JAR
          source: "target/*.jar"
          target: "C:/Windows/Temp/"
          strip_components: 1
          debug: true # Activa logs detallados del SCP

      # 4. SCRIPT DE DIAGNÓSTICO EN SERVIDOR
      - name: Debug on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            powershell -Command "
              # Quitamos el SilentlyContinue global para ver errores
              \$ErrorActionPreference = 'Stop'
              
              Write-Host '=== 🕵️ INICIANDO DIAGNÓSTICO EN SERVIDOR ==='
              
              # 1. VERIFICAR SI LLEGÓ EL ARCHIVO
              Write-Host '1. Buscando archivos en C:\Windows\Temp\ ...'
              \$tempFiles = Get-ChildItem 'C:\Windows\Temp\*.jar'
              
              if (\$tempFiles) {
                  Write-Host '✅ ARCHIVO ENCONTRADO EN TEMP:'
                  \$tempFiles | Format-Table Name, LastWriteTime -AutoSize
                  
                  # Tomamos el más reciente
                  \$nuevoJar = \$tempFiles | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                  Write-Host '👉 Se usará este archivo:' \$nuevoJar.Name
                  
                  # ---------------------------------------------------------
                  # INTENTO DE DESPLIEGUE REAL
                  # ---------------------------------------------------------
                  \$deployDir = 'C:\nginx-1.27.1\html\front'
                  \$jarName   = 'wms-backend-test.jar'
                  \$targetPath = Join-Path \$deployDir \$jarName
                  
                  Write-Host '2. Destino final:' \$targetPath
                  
                  # Parar proceso (Con try/catch para no fallar si no existe)
                  try {
                      \$port = 9000
                      Write-Host '🛑 Buscando proceso en puerto' \$port
                      \$proc = Get-NetTCPConnection -LocalPort \$port -State Listen -ErrorAction Stop
                      if (\$proc) {
                          Stop-Process -Id \$proc.OwningProcess -Force
                          Write-Host '   Proceso detenido.'
                          Start-Sleep -Seconds 2
                      }
                  } catch {
                      Write-Host '   (No había nada corriendo en el puerto 9000)'
                  }
                  
                  # Mover archivo
                  Write-Host '🚀 Moviendo archivo...'
                  Move-Item -Path \$nuevoJar.FullName -Destination \$targetPath -Force
                  
                  # Verificar si se movió
                  if (Test-Path \$targetPath) {
                      Write-Host '✅ Archivo movido exitosamente.'
                      
                      # Iniciar
                      Write-Host '🔥 Iniciando JAVAW...'
                      \$log = Join-Path \$deployDir 'backend.log'
                      \$args = '-jar', \$targetPath, \"--server.port=9000\"
                      Start-Process 'javaw' -ArgumentList \$args -RedirectStandardOutput \$log -RedirectStandardError \$log -WindowStyle Hidden
                      Write-Host '✅ Comando de inicio enviado.'
                  } else {
                      Write-Error '❌ ERROR CRÍTICO: El archivo no aparece en la carpeta destino después de moverlo.'
                  }
                  
              } else {
                  Write-Error '❌ ERROR: No hay archivos .jar en C:\Windows\Temp\. El SCP falló o subió a otro lado.'
                  Write-Host 'Contenido actual de Temp:'
                  Get-ChildItem 'C:\Windows\Temp\' | Select-Object Name
              }
            "
