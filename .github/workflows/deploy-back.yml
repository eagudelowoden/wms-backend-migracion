name: Deploy BACKEND TEST

on:
  push:
    branches: [ develop ]
    # paths:
    #   - 'wms-backend/**' # Solo se activa si tocas el backend

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configurar Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Ajusta a tu versión de Java (17, 21, etc.)
          distribution: 'temurin'
          cache: 'maven'

      # 2. Compilar (Saltando Tests como pediste)
      - name: Build with Maven
        run: |
          cd wms-backend
          mvn clean package -DskipTests

      # 3. Subir el JAR nuevo a una carpeta Temporal
      # Lo renombramos a "new-backend.jar" para facilitar el script
      - name: Upload JAR to Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          # Busca cualquier .jar en target
          source: "wms-backend/target/*.jar"
          target: "C:/Windows/Temp/" 
          # Esto elimina la estructura de carpetas (wms-backend/target) al copiar
          strip_components: 2

      # 4. Script Maestro: Stop -> Backup -> Start
      - name: Stop, Backup & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            powershell -Command "
              \$ErrorActionPreference = 'SilentlyContinue' # No fallar si no hay proceso corriendo
              
              # --- VARIABLES ---
              \$deployDir = 'C:\nginx-1.27.1\html\front'
              \$backupDir = 'C:\nginx-1.27.1\html\front\_backups\back'
              \$jarName   = 'wms-backend-test.jar' # Nombre FIJO que usaremos para correr
              \$port      = 9000
              
              Write-Host '=== INICIANDO DESPLIEGUE BACKEND ==='

              # 1. BUSCAR Y MATAR PROCESO EN PUERTO 9000
              Write-Host '🛑 Buscando proceso en puerto' \$port '...'
              \$processParams = Get-NetTCPConnection -LocalPort \$port -State Listen -ErrorAction SilentlyContinue
              if (\$processParams) {
                  \$pidTarget = \$processParams.OwningProcess
                  Write-Host '   Encontrado PID:' \$pidTarget '- Deteniendo...'
                  Stop-Process -Id \$pidTarget -Force
                  Start-Sleep -Seconds 3 # Esperar a que suelte el archivo
              } else {
                  Write-Host '   No hay nada corriendo en el puerto' \$port
              }

              # 2. HACER BACKUP DEL JAR ACTUAL
              \$currentJar = Join-Path \$deployDir \$jarName
              if (Test-Path \$currentJar) {
                  Write-Host '📦 Creando Backup...'
                  if (-not (Test-Path \$backupDir)) { New-Item -ItemType Directory -Path \$backupDir -Force | Out-Null }
                  
                  \$timestamp = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
                  \$backupName = 'backup_' + \$timestamp + '.jar'
                  \$backupPath = Join-Path \$backupDir \$backupName
                  
                  Move-Item -Path \$currentJar -Destination \$backupPath -Force
                  Write-Host '   Backup guardado en:' \$backupPath
              }

              # 3. MOVER EL NUEVO JAR (Desde Temp)
              # Buscamos el jar que subimos (cualquier nombre) y lo movemos como el nombre FIJO
              \$tempJar = Get-ChildItem 'C:\Windows\Temp\*.jar' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              
              if (\$tempJar) {
                  Write-Host '🚀 Moviendo nuevo JAR:' \$tempJar.Name
                  Move-Item -Path \$tempJar.FullName -Destination \$currentJar -Force
              } else {
                  Write-Error '❌ NO SE ENCONTRÓ EL JAR EN TEMP. ABORTANDO.'
                  exit 1
              }

              # 4. INICIAR EL NUEVO SERVICIO
              Write-Host '🔥 Iniciando Spring Boot en puerto' \$port '...'
              # Usamos Start-Process para que sea independiente de la sesión SSH
              # Redirigimos logs a un archivo para que puedas ver si falla al arrancar
              \$logFile = Join-Path \$deployDir 'backend.log'
              
              \$argList = '-jar', \$currentJar, \"--server.port=\$port\"
              
              Start-Process 'java' -ArgumentList \$argList -RedirectStandardOutput \$logFile -RedirectStandardError \$logFile -WindowStyle Hidden
              
              Write-Host '✅ Proceso iniciado. Revisa backend.log si hay errores.'
            "