name: Deploy BACKEND TEST

on:
  push:
    branches: [develop]
    # Quitamos el filtro 'paths' porque todo el repo es backend
    # paths:
    #   - 'wms-backend/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configurar Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # 2. Compilar (YA NO HACEMOS CD, estamos en la raíz)
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      # 3. Subir el JAR (Ruta ajustada: target/*.jar)
      - name: Upload JAR to Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          # El jar está directo en target/, no en wms-backend/target/
          source: "target/*.jar"
          target: "C:/Windows/Temp/"
          strip_components: 1 # Ajustado a 1 porque ahora es solo target/archivo.jar

      # 4. Script Maestro (Stop -> Backup -> Start)
      - name: Stop, Backup & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            powershell -Command "
              \$ErrorActionPreference = 'SilentlyContinue'
              
              # --- VARIABLES ---
              \$deployDir = 'C:\nginx-1.27.1\html\front'
              \$backupDir = 'C:\nginx-1.27.1\html\front\_backups\back'
              \$jarName   = 'wms-backend-test.jar'
              \$port      = 9000
              
              Write-Host '=== INICIANDO DESPLIEGUE BACKEND (JAVA 21) ==='

              # 1. MATAR PROCESO
              Write-Host '🛑 Buscando proceso en puerto' \$port '...'
              \$processParams = Get-NetTCPConnection -LocalPort \$port -State Listen -ErrorAction SilentlyContinue
              if (\$processParams) {
                  \$pidTarget = \$processParams.OwningProcess
                  Write-Host '   Encontrado PID:' \$pidTarget '- Deteniendo...'
                  Stop-Process -Id \$pidTarget -Force
                  Start-Sleep -Seconds 3
              }

              # 2. BACKUP
              \$currentJar = Join-Path \$deployDir \$jarName
              if (Test-Path \$currentJar) {
                  Write-Host '📦 Creando Backup...'
                  if (-not (Test-Path \$backupDir)) { New-Item -ItemType Directory -Path \$backupDir -Force | Out-Null }
                  
                  \$timestamp = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
                  \$backupName = 'backup_' + \$timestamp + '.jar'
                  \$backupPath = Join-Path \$backupDir \$backupName
                  
                  Move-Item -Path \$currentJar -Destination \$backupPath -Force
              }

              # 3. MOVER EL NUEVO JAR
              \$tempJar = Get-ChildItem 'C:\Windows\Temp\*.jar' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if (\$tempJar) {
                  Write-Host '🚀 Moviendo nuevo JAR...'
                  Move-Item -Path \$tempJar.FullName -Destination \$currentJar -Force
              } else {
                  Write-Error '❌ NO SE ENCONTRÓ EL JAR EN TEMP.'
                  exit 1
              }

              # 4. INICIAR SIN CONSOLA (JAVAW)
              Write-Host '🔥 Iniciando Spring Boot en puerto' \$port '...'
              \$logFile = Join-Path \$deployDir 'backend.log'
              \$argList = '-jar', \$currentJar, \"--server.port=\$port\"
              
              # Javaw corre en background, el action terminará exitosamente de inmediato
              Start-Process 'javaw' -ArgumentList \$argList -RedirectStandardOutput \$logFile -RedirectStandardError \$logFile -WindowStyle Hidden
              
              Write-Host '✅ Proceso lanzado en segundo plano.'
            "
