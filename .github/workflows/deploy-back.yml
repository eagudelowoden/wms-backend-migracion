name: Deploy BACKEND TEST

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Configurar Java 21 (versión requerida por el pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # 2. Compilar (Saltando tests para rapidez)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 3. Subir JAR a Temporal (C:\Windows\Temp)
      - name: Upload JAR to Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "target/*.jar"
          target: "C:/Windows/Temp/"
          strip_components: 1

      # 4. Script Maestro: Stop -> Backup -> Start (HIDDEN)
      - name: Remote Restart Logic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            powershell -Command "
              \$ErrorActionPreference = 'SilentlyContinue'
              
              # --- CONFIGURACIÓN ---
              \$deployDir = 'C:\nginx-1.27.1\html\front'
              \$backupDir = 'C:\nginx-1.27.1\html\front\_backups\back'
              \$jarName   = 'wms-backend-test.jar' # Nombre ESTÁNDAR para que el script siempre sepa cual correr
              \$port      = 9000
              \$logFile   = Join-Path \$deployDir 'backend.log'

              Write-Host '=== 🚀 INICIANDO DESPLIEGUE BACKEND ==='

              # ---------------------------------------------------------
              # 1. DETENER PROCESO EN PUERTO 9000
              # ---------------------------------------------------------
              Write-Host '🛑 Buscando proceso en puerto' \$port '...'
              \$connection = Get-NetTCPConnection -LocalPort \$port -State Listen -ErrorAction SilentlyContinue
              
              if (\$connection) {
                  \$pidTarget = \$connection.OwningProcess
                  Write-Host '   Matando proceso PID:' \$pidTarget
                  Stop-Process -Id \$pidTarget -Force
                  
                  # Esperar a que libere el archivo y el puerto
                  Start-Sleep -Seconds 5
              } else {
                  Write-Host '   El puerto' \$port 'está libre.'
              }

              # ---------------------------------------------------------
              # 2. BACKUP DEL JAR VIEJO
              # ---------------------------------------------------------
              \$currentJarPath = Join-Path \$deployDir \$jarName
              
              if (Test-Path \$currentJarPath) {
                  Write-Host '📦 Creando Backup...'
                  if (-not (Test-Path \$backupDir)) { New-Item -ItemType Directory -Path \$backupDir -Force | Out-Null }
                  
                  \$timestamp = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'
                  # Guardamos el backup con el nombre original o con fecha
                  \$backupPath = Join-Path \$backupDir ('backup_' + \$timestamp + '.jar')
                  
                  Move-Item -Path \$currentJarPath -Destination \$backupPath -Force
                  Write-Host '   Backup guardado en:' \$backupPath
              }

              # ---------------------------------------------------------
              # 3. COLOCAR NUEVO JAR
              # ---------------------------------------------------------
              # Buscamos el jar recién subido en Temp (el más nuevo)
              \$newJar = Get-ChildItem 'C:\Windows\Temp\*.jar' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              
              if (\$newJar) {
                  Write-Host '✨ Instalando nuevo JAR:' \$newJar.Name
                  # Lo movemos y renombramos al nombre ESTÁNDAR (wms-backend-test.jar)
                  Move-Item -Path \$newJar.FullName -Destination \$currentJarPath -Force
              } else {
                  Write-Error '❌ ERROR CRÍTICO: No se encontró el JAR en Temp.'
                  exit 1
              }

              # ---------------------------------------------------------
              # 4. INICIAR VIA TAREA PROGRAMADA 'WMS-Backend'
              # La tarea corre con usuario y contraseña guardados en el servidor,
              # por lo que el backend nace con credenciales de red completas
              # (acceso al share de PRN \\10.128.0.28\archivos).
              # ---------------------------------------------------------
              Write-Host '🔥 Iniciando Spring Boot via tarea programada WMS-Backend...'
              # Cerrar cualquier instancia previa de la tarea (si quedó en estado Running, /run no relanza)
              schtasks /end /tn 'WMS-Backend' | Out-Null
              Start-Sleep -Seconds 3
              schtasks /run /tn 'WMS-Backend'

              if (\$LASTEXITCODE -ne 0) {
                  Write-Error '❌ No se pudo ejecutar la tarea programada WMS-Backend. Verifique que exista (schtasks /query /tn WMS-Backend).'
                  exit 1
              }

              # Verificar que el puerto quede escuchando (hasta 60s)
              \$started = \$false
              for (\$i = 1; \$i -le 12; \$i++) {
                  Start-Sleep -Seconds 5
                  if (Get-NetTCPConnection -LocalPort \$port -State Listen -ErrorAction SilentlyContinue) {
                      \$started = \$true
                      Write-Host '✅ Backend escuchando en puerto' \$port '(intento' \$i ')'
                      break
                  }
                  Write-Host '   Intento' \$i 'de 12: puerto' \$port 'aún no escucha...'
              }

              if (-not \$started) {
                  Write-Warning '⚠️ El puerto no escucha tras 60s. Revise el log del backend.'
              }
            "
