name: Deploy BACKEND (Unlock Fix)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-backend-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build
        run: mvn -B clean package -DskipTests

      # 1. Subir a Temp (Ya sabemos que esto funciona)
      - name: Upload JAR to Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "target/*.jar"
          target: "C:/Windows/Temp/"
          strip_components: 1

      # 2. SCRIPT ROBUSTO (Manejo de Bloqueos)
      - name: Stop, Unlock & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            powershell -Command "
              \$ErrorActionPreference = 'Stop'
              Write-Host '=== 🚀 INICIANDO ACTUALIZACIÓN BACKEND ==='

              \$destDir  = 'C:\nginx-1.27.1\html\front'
              \$destFile = 'wms-backend-test.jar'
              \$fullDest = Join-Path \$destDir \$destFile
              \$port     = 9000
              
              # ---------------------------------------------------------
              # PASO 1: MATAR EL PROCESO AGRESIVAMENTE
              # ---------------------------------------------------------
              Write-Host '🛑 1. Deteniendo servicio en puerto' \$port
              try {
                  \$procs = Get-NetTCPConnection -LocalPort \$port -State Listen -ErrorAction SilentlyContinue
                  if (\$procs) {
                      foreach (\$p in \$procs) {
                          Write-Host '   Matando PID:' \$p.OwningProcess
                          Stop-Process -Id \$p.OwningProcess -Force -ErrorAction SilentlyContinue
                      }
                      # ESPERA CRÍTICA: Dar tiempo a Windows para soltar el archivo
                      Write-Host '   ⏳ Esperando 5 segundos para liberar el archivo...'
                      Start-Sleep -Seconds 5
                  } else {
                      Write-Host '   (No se encontró proceso en puerto 9000, seguimos)'
                  }
              } catch {
                  Write-Host '   ⚠️ Advertencia al intentar detener proceso:' \$_
              }

              # ---------------------------------------------------------
              # PASO 2: INTENTAR MOVER EL ARCHIVO (Con reintentos)
              # ---------------------------------------------------------
              Write-Host '📦 2. Buscando nuevo JAR en Temp...'
              \$tempJar = Get-ChildItem 'C:\Windows\Temp\*.jar' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              
              if (!\$tempJar) {
                  Write-Error '❌ ERROR: No hay JAR en C:\Windows\Temp. El SCP falló.'
                  exit 1
              }

              Write-Host '👉 Nuevo archivo:' \$tempJar.Name
              
              # Intentamos mover. Si falla por bloqueo, reintentamos una vez más.
              try {
                  Write-Host '🔄 Intentando mover archivo al destino...'
                  Move-Item -Path \$tempJar.FullName -Destination \$fullDest -Force
                  Write-Host '✅ Archivo movido exitosamente.'
              } catch {
                  Write-Host '⚠️ FALLÓ EL PRIMER INTENTO DE MOVER (¿Archivo bloqueado?)'
                  Write-Host '   Error: ' \$_
                  
                  Write-Host '⏳ Esperando 5 segundos más e intentando forzar...'
                  Start-Sleep -Seconds 5
                  
                  # Intento de rescate: Forzar borrado del viejo primero
                  try {
                      if (Test-Path \$fullDest) { Remove-Item \$fullDest -Force }
                      Move-Item -Path \$tempJar.FullName -Destination \$fullDest -Force
                      Write-Host '✅ SEGUNDO INTENTO EXITOSO.'
                  } catch {
                      Write-Error '❌ ERROR FATAL: No se puede reemplazar el archivo. Windows lo tiene bloqueado. Reinicia el servidor manual o mata java.exe.'
                      exit 1
                  }
              }

              # ---------------------------------------------------------
              # PASO 3: EJECUTAR EN SEGUNDO PLANO
              # ---------------------------------------------------------
              Write-Host '🔥 3. Iniciando Spring Boot...'
              \$logPath = Join-Path \$destDir 'backend.log'
              
              # Usamos Start-Process con Passthru para confirmar que arrancó
              \$process = Start-Process 'javaw' -ArgumentList '-jar', \$fullDest, \"--server.port=\$port\" -RedirectStandardOutput \$logPath -RedirectStandardError \$logPath -WindowStyle Hidden -PassThru
              
              if (\$process.Id) {
                  Write-Host '✅ ÉXITO: Nuevo proceso corriendo con PID:' \$process.Id
                  Write-Host '   Logs en:' \$logPath
              } else {
                  Write-Error '❌ El proceso JAVAW no devolvió un PID. Puede haber fallado al arrancar.'
              }
            "
