name: Deploy BACKEND TEST

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # PASO 1: CONFIGURAR JAVA Y BUILD
      # -------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven (skip tests)
        run: mvn -B clean package -DskipTests

      # -------------------------------------------------------------
      # PASO 2: GENERAR SCRIPT DE DESPLIEGUE
      # -------------------------------------------------------------
      - name: Create Backend Deployment Script
        run: |
          cat <<EOF > remote_deploy_backend.ps1
          \$ErrorActionPreference = 'Stop'
          Write-Host "=== STARTING BACKEND DEPLOYMENT ==="

          \$deployPath = "C:\nginx-1.27.1\html\front"
          \$backupRoot = "C:\nginx-1.27.1\html\front\_backups\back"
          \$tempPath = "C:\Windows\Temp"
          \$port = 9000
          \$timestamp = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'

          # 1. DETENER PROCESO EN PUERTO 9000
          Write-Host "Checking for process on port \$port..."
          \$connection = Get-NetTCPConnection -LocalPort \$port -State Listen -ErrorAction SilentlyContinue
          
          if (\$connection) {
              \$pid = \$connection.OwningProcess
              
              # Filtrar PIDs inválidos (0, negativos, etc.)
              if (\$pid -gt 0) {
                  # Verificar que sea realmente Java
                  \$processInfo = Get-Process -Id \$pid -ErrorAction SilentlyContinue
                  
                  if (\$processInfo -and \$processInfo.ProcessName -match 'java') {
                      Write-Host "Found Java process PID: \$pid (\$(\$processInfo.ProcessName)). Stopping..."
                      Stop-Process -Id \$pid -Force
                      Start-Sleep -Seconds 5
                      Write-Host "Process stopped successfully."
                  } else {
                      Write-Host "WARNING: Process on port \$port is not Java (PID: \$pid). Skipping..."
                  }
              } else {
                  Write-Host "WARNING: Invalid PID detected (\$pid). Skipping..."
              }
          } else {
              Write-Host "No process running on port \$port."
          }

          # 2. CREAR CARPETA DE BACKUPS SI NO EXISTE
          if (-not (Test-Path \$backupRoot)) {
              New-Item -ItemType Directory -Path \$backupRoot -Force | Out-Null
              Write-Host "Backup directory created: \$backupRoot"
          }

          # 3. MOVER JAR ANTERIOR A BACKUPS
          \$currentJar = Get-ChildItem -Path \$deployPath -Filter "wms-backend-*.jar" | Select-Object -First 1
          
          if (\$currentJar) {
              \$backupName = "\$(\$currentJar.BaseName)_\$timestamp.jar"
              \$backupPath = Join-Path \$backupRoot \$backupName
              
              Write-Host "Moving current JAR to backup: \$backupName"
              Move-Item -Path \$currentJar.FullName -Destination \$backupPath -Force
              Write-Host "Backup completed."
          } else {
              Write-Host "No existing JAR found to backup."
          }

          # 4. MOVER NUEVO JAR DESDE TEMP
          \$newJar = Get-ChildItem -Path \$tempPath -Filter "wms-backend-*.jar" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          
          if (\$newJar) {
              \$targetPath = Join-Path \$deployPath \$newJar.Name
              Write-Host "Moving new JAR: \$(\$newJar.Name)"
              Move-Item -Path \$newJar.FullName -Destination \$targetPath -Force
              Write-Host "JAR deployed to: \$targetPath"
              
              # 5. EJECUTAR NUEVO JAR
              Write-Host "Starting backend service on port \$port..."
              \$logFile = Join-Path \$deployPath "backend-\$timestamp.log"
              
              Start-Process -FilePath "java" -ArgumentList "-jar", \$targetPath -RedirectStandardOutput \$logFile -RedirectStandardError \$logFile -WindowStyle Hidden
              
              Write-Host "Backend service started. Logs: \$logFile"
              Write-Host "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
          } else {
              Write-Error "ERROR: No new JAR found in Temp folder!"
              exit 1
          }
          EOF

      # -------------------------------------------------------------
      # PASO 3: SUBIR SCRIPT AL SERVIDOR
      # -------------------------------------------------------------
      - name: Upload Deployment Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "remote_deploy_backend.ps1"
          target: "C:/Windows/Temp/"

      # -------------------------------------------------------------
      # PASO 4: SUBIR JAR A TEMP
      # -------------------------------------------------------------
      - name: Upload JAR to Server Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "target/wms-backend-*.jar"
          target: "C:/Windows/Temp/"
          strip_components: 1

      # -------------------------------------------------------------
      # PASO 5: EJECUTAR SCRIPT DE DESPLIEGUE
      # -------------------------------------------------------------
      - name: Execute Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script_stop: true
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\Windows\Temp\remote_deploy_backend.ps1"
            del "C:\Windows\Temp\remote_deploy_backend.ps1"