name: Deploy BACKEND PROD

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # PASO 1: CONFIGURAR JAVA Y BUILD
      # -------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Caché adicional para el repositorio local de Maven
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download dependencies
        run: mvn dependency:go-offline -B

      - name: Build with Maven (skip tests)
        run: mvn -B clean package -DskipTests -o

      # -------------------------------------------------------------
      # PASO 2: GENERAR SCRIPT DE DESPLIEGUE
      # -------------------------------------------------------------
      - name: Create Backend Deployment Script
        run: |
          cat <<'EOF' > remote_deploy_backend.ps1
          $ErrorActionPreference = 'Stop'
          Write-Host "=== STARTING BACKEND DEPLOYMENT ==="

          $deployPath = "C:\WMS Web API\wms-prd"
          $backupRoot = "C:\WMS Web API\wms-prd\_backups\back"
          $tempPath = "C:\Windows\Temp"
          $port = 9000
          $timestamp = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'

          # 1. DETENER PROCESO EN PUERTO 9000
          Write-Host "Checking for process on port $port..."
          $netstatOutput = netstat -ano | Select-String ":$port.*LISTENING"

          if ($netstatOutput) {
              $line = $netstatOutput[0].ToString().Trim()
              $processPid = ($line -split '\s+')[-1]
              
              if ($processPid -match '^\d+$' -and [int]$processPid -gt 0) {
                  $processInfo = Get-Process -Id $processPid -ErrorAction SilentlyContinue
                  
                  if ($processInfo) {
                      Write-Host "Found process PID: $processPid ($($processInfo.ProcessName)). Stopping..."
                      taskkill /F /PID $processPid
                      Start-Sleep -Seconds 5
                      Write-Host "Process stopped."
                  }
              }
          } else {
              Write-Host "No process listening on port $port."
          }

          # 2. CREAR CARPETA DE BACKUPS SI NO EXISTE
          if (-not (Test-Path $backupRoot)) {
              New-Item -ItemType Directory -Path $backupRoot -Force | Out-Null
              Write-Host "Backup directory created: $backupRoot"
          }

          # 3. MOVER JAR ANTERIOR A BACKUPS
          $currentJar = Get-ChildItem -Path $deployPath -Filter "wms-backend-*.jar" | Select-Object -First 1

          if ($currentJar) {
              $backupName = "$($currentJar.BaseName)_$timestamp.jar"
              $backupPath = Join-Path $backupRoot $backupName
              
              Write-Host "Moving current JAR to backup: $backupName"
              Move-Item -Path $currentJar.FullName -Destination $backupPath -Force
              Write-Host "Backup completed."
          } else {
              Write-Host "No existing JAR found to backup."
          }

          # 4. MOVER NUEVO JAR DESDE TEMP
          $newJar = Get-ChildItem -Path $tempPath -Filter "wms-backend-*.jar" | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if ($newJar) {
              $targetPath = Join-Path $deployPath $newJar.Name
              Write-Host "Moving new JAR: $($newJar.Name)"
              Move-Item -Path $newJar.FullName -Destination $targetPath -Force
              Write-Host "JAR deployed to: $targetPath"
              
              # 5. EJECUTAR NUEVO JAR
              Write-Host "Starting backend service on port $port..."
              
              # Crear archivos de log
              $logFileOut = Join-Path $deployPath "backend-$timestamp.log"
              $logFileErr = Join-Path $deployPath "backend-$timestamp-error.log"
              
              # Ejecutar JAR en background redirigiendo logs
              $javaPath = (Get-Command javaw).Source
              $arguments = "-jar `"$targetPath`" > `"$logFileOut`" 2> `"$logFileErr`""
              
              $processStartup = ([wmiclass]"Win32_ProcessStartup").CreateInstance()
              $processStartup.ShowWindow = 0  # Hidden window
              
              $processClass = [wmiclass]"Win32_Process"
              # Usar cmd.exe para manejar la redirección de salida
              $cmdLine = "cmd.exe /c `"$javaPath -jar `"$targetPath`" > `"$logFileOut`" 2> `"$logFileErr`"`""
              $result = $processClass.Create($cmdLine, $deployPath, $processStartup)
              
              if ($result.ReturnValue -eq 0) {
                  $newPid = $result.ProcessId
                  Write-Host "Backend process started successfully with PID: $newPid"
                  Write-Host "  Output log: $logFileOut"
                  Write-Host "  Error log: $logFileErr"
              } else {
                  Write-Error "Failed to start process. Return code: $($result.ReturnValue)"
                  exit 1
              }
              
              # Esperar y verificar que el puerto está en uso (con reintentos)
              Write-Host "Waiting for backend service to start..."
              $maxAttempts = 12
              $attempt = 0
              $started = $false
              
              while ($attempt -lt $maxAttempts -and -not $started) {
                  Start-Sleep -Seconds 5
                  $attempt++
                  
                  $checkPort = netstat -ano | Select-String ":$port.*LISTENING"
                  
                  if ($checkPort) {
                      $started = $true
                      Write-Host "Backend service started successfully and listening on port $port (attempt $attempt)."
                  } else {
                      Write-Host "  Attempt $attempt/$maxAttempts - Port $port not listening yet..."
                  }
              }
              
              if (-not $started) {
                  Write-Warning "Service may still be starting. Port $port is not listening after $maxAttempts attempts."
                  Write-Warning "Check the application manually or review process with PID: $newPid"
              }
              
              Write-Host "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
          } else {
              Write-Error "ERROR: No new JAR found in Temp folder!"
              exit 1
          }
          EOF

      # -------------------------------------------------------------
      # PASO 3: SUBIR SCRIPT AL SERVIDOR
      # -------------------------------------------------------------
      - name: Upload Deployment Script to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "remote_deploy_backend.ps1"
          target: "C:/Windows/Temp/"

      # -------------------------------------------------------------
      # PASO 4: SUBIR JAR A TEMP
      # -------------------------------------------------------------
      - name: Upload JAR to Server Temp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "target/wms-backend-*.jar"
          target: "C:/Windows/Temp/"
          strip_components: 1

      # -------------------------------------------------------------
      # PASO 5: EJECUTAR SCRIPT DE DESPLIEGUE
      # -------------------------------------------------------------
      - name: Execute Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            powershell -ExecutionPolicy Bypass -File "C:\Windows\Temp\remote_deploy_backend.ps1"
            del "C:\Windows\Temp\remote_deploy_backend.ps1"
